name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run frontend tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}

          {
            echo "## Frontend test summary"
            echo
            grep -E "^(Test Suites:|Tests:|Snapshots:|Time:)" test-output.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status
